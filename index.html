<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eaf1ff;
    --ink-dim:rgba(220,232,255,.68);
    --glass:rgba(255,255,255,.07);
    --glass-edge:rgba(255,255,255,.24);
    --panel:rgba(6,11,28,.46);
    --accent:#6fb4ff;
    --accent-2:#8a6bff;
    --danger:#ff8f9c;
    --font:'Space Grotesk','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  button{font-family:inherit;color:inherit}
  .hidden{opacity:0!important;visibility:hidden!important;pointer-events:none!important}

  /* ---------- Loader ---------- */
  #loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#02040c;transition:opacity .9s ease,visibility .9s ease}
  #loader .orbit{width:64px;height:64px;border-radius:50%;border:1px solid rgba(111,180,255,.25);position:relative;animation:spin 2.4s linear infinite}
  #loader .orbit::after{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  #loaderText{font-size:15px;letter-spacing:.04em;color:var(--ink-dim);text-align:center;padding:0 24px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;transition:opacity .9s ease,visibility .9s ease,transform .9s ease}
  #login.out{opacity:0;visibility:hidden;transform:scale(1.04)}
  .card{
    pointer-events:auto;width:min(100%,410px);padding:38px 34px 30px;border-radius:24px;
    background:var(--glass);
    border:1px solid var(--glass-edge);
    -webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 40px rgba(120,160,255,.05);
    animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .card.shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .brand svg{flex:none;filter:drop-shadow(0 0 10px rgba(111,180,255,.55))}
  .brand h1{font-size:25px;font-weight:600;letter-spacing:.01em;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .brand p{font-size:13.5px;color:var(--ink-dim);margin-top:4px}
  .field{display:block;margin-bottom:16px}
  .field > span{display:block;font-size:13.5px;font-weight:500;margin-bottom:7px;color:rgba(235,242,255,.9);text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .input-wrap{position:relative}
  .field input{
    width:100%;height:48px;padding:0 16px;border-radius:13px;font:inherit;font-size:16px;color:#fff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.26);outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .field input::placeholder{color:rgba(225,235,255,.45)}
  .field input:focus{border-color:var(--accent);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(111,180,255,.25)}
  .field input:-webkit-autofill{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 1000px rgba(22,32,70,.75) inset;caret-color:#fff}
  #togglePass{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:32px;padding:0 11px;border-radius:9px;border:0;background:rgba(255,255,255,.1);font-size:12.5px;cursor:pointer;color:var(--ink-dim)}
  #togglePass:hover{background:rgba(255,255,255,.18);color:#fff}
  #togglePass:focus-visible,.btn:focus-visible,.chip:focus-visible,.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #pass{padding-right:74px}
  .error{min-height:20px;margin:-2px 0 10px;font-size:13.5px;color:var(--danger);text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .btn{
    width:100%;height:50px;border:0;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;
    background:linear-gradient(120deg,#3f95ff,#7b5cff);
    box-shadow:0 10px 30px rgba(79,120,255,.38);transition:transform .15s,box-shadow .2s,filter .2s;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 14px 36px rgba(79,120,255,.5)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.7;cursor:wait}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .9s ease .35s,visibility .9s ease .35s}
  #hud > *{pointer-events:auto}
  .glass{background:var(--panel);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 36px rgba(0,0,0,.35)}
  #topbar{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  #topbar > *{pointer-events:auto}
  .tag{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600}
  .tag i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .user{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 16px;border-radius:999px;font-size:14px;color:var(--ink-dim)}
  .user button{height:34px;padding:0 15px;border-radius:999px;border:0;cursor:pointer;background:rgba(255,255,255,.12);font-size:14px;font-weight:500}
  .user button:hover{background:rgba(255,255,255,.22)}
  #info{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 68px);width:min(255px,62vw);padding:16px 18px;border-radius:18px;transition:opacity .3s}
  #info .kicker{font-size:12.5px;color:var(--accent);font-weight:500}
  #info h2{font-size:24px;font-weight:600;margin:2px 0 10px}
  #info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
  #info dt{color:var(--ink-dim)}
  #info dd{text-align:right}
  #side{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border-radius:20px}
  .ctl{width:44px;height:44px;border-radius:14px;border:0;cursor:pointer;background:rgba(255,255,255,.09);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .ctl:hover{background:rgba(255,255,255,.2)}
  .ctl.small{font-size:13px;font-weight:600}
  .ctl[aria-pressed="false"]{opacity:.5}
  #zoomRead{font-size:12px;color:var(--ink-dim);padding:2px 0 4px;min-width:44px;text-align:center}
  #bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
  #hint{text-align:center;font-size:13px;color:var(--ink-dim);margin-bottom:10px;text-shadow:0 1px 10px #000}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;pointer-events:auto;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  #chips > :first-child{margin-left:auto}
  #chips > :last-child{margin-right:auto}
  .chip{flex:none;height:40px;padding:0 16px;border-radius:999px;font-size:14.5px;font-weight:500;cursor:pointer;background:var(--panel);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .2s,border-color .2s,color .2s}
  .chip:hover{background:rgba(255,255,255,.16)}
  .chip.active{background:linear-gradient(120deg,rgba(63,149,255,.85),rgba(123,92,255,.85));border-color:transparent;color:#fff}
  #labels{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .label{position:absolute;left:0;top:0;font-size:12.5px;font-weight:500;color:#d6e6ff;white-space:nowrap;text-shadow:0 0 6px #000,0 1px 10px #000;will-change:transform;opacity:.9}

  @media (max-width:560px){
    .card{padding:30px 24px 26px}
    .tag{font-size:13.5px;padding:8px 13px}
    .user{font-size:13px;padding-left:12px}
    #info{padding:13px 15px}
    #info h2{font-size:21px}
    #side{right:8px}
    #hint{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .card,.card.shake{animation:none}
    #loader .orbit{animation-duration:6s}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>

<div id="loader">
  <div class="orbit"></div>
  <div id="loaderText">Building the universe...</div>
</div>

<!-- ============ PAGE 1: LOGIN ============ -->
<div id="login">
  <form class="card" id="loginForm" autocomplete="off" novalidate>
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <radialGradient id="pg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3b5bdb"/></radialGradient>
        </defs>
        <ellipse cx="24" cy="25" rx="22" ry="7" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.6" transform="rotate(-18 24 25)"/>
        <circle cx="24" cy="24" r="12" fill="url(#pg)"/>
        <path d="M5 31c7 5 29 -1 38 -11" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round" transform="rotate(0)" opacity=".0"/>
        <ellipse cx="24" cy="25" rx="22" ry="7" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-dasharray="34 80" stroke-dashoffset="-46" transform="rotate(-18 24 25)"/>
      </svg>
      <div>
        <h1>Solar System Explorer</h1>
        <p>Sign in to enter the cosmos</p>
      </div>
    </div>

    <label class="field">
      <span>Username</span>
      <div class="input-wrap"><input id="user" name="username" type="text" placeholder="Enter username" autocapitalize="none" spellcheck="false" autocomplete="off" required></div>
    </label>

    <label class="field">
      <span>Password</span>
      <div class="input-wrap">
        <input id="pass" name="password" type="password" placeholder="Enter password" autocomplete="off" required>
        <button type="button" id="togglePass" aria-label="Show password">Show</button>
      </div>
    </label>

    <div class="error" id="error" role="alert" aria-live="polite"></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </form>
</div>

<!-- ============ PAGE 2: 3D EXPLORER ============ -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div class="tag glass"><i></i>Solar System Explorer</div>
    <div class="user glass"><span id="whoami">admin</span><button id="logout" type="button">Log out</button></div>
  </div>

  <div id="info" class="glass">
    <div class="kicker" id="infoKicker">Planet</div>
    <h2 id="infoName">Earth</h2>
    <dl id="infoRows"></dl>
  </div>

  <div id="side" class="glass">
    <button class="ctl" id="zoomIn" type="button" aria-label="Zoom in">+</button>
    <div id="zoomRead">100%</div>
    <button class="ctl" id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
    <button class="ctl small" id="speedBtn" type="button" aria-label="Change animation speed">1&times;</button>
    <button class="ctl small" id="pauseBtn" type="button" aria-label="Pause or play animation">Pause</button>
    <button class="ctl small" id="labelBtn" type="button" aria-pressed="true" aria-label="Toggle labels">Tags</button>
  </div>

  <div id="bottom">
    <div id="hint">Drag to rotate. Scroll or pinch to zoom.</div>
    <div id="chips" role="tablist" aria-label="Choose what to view"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var smooth = function (a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  var wrapAngle = function (a) { return Math.atan2(Math.sin(a), Math.cos(a)); };

  /* =====================================================
     LOGIN  (username: admin / password: admin)
     ===================================================== */
  var app = { loggedIn: false, onLogin: function () {}, onLogout: function () {} };
  var loginEl = $('login'), hudEl = $('hud'), card = $('loginForm');
  var userIn = $('user'), passIn = $('pass'), errEl = $('error'), loginBtn = $('loginBtn');

  $('togglePass').addEventListener('click', function () {
    var show = passIn.type === 'password';
    passIn.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  card.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = userIn.value.trim(), p = passIn.value;
    if (u === 'admin' && p === 'admin') {
      errEl.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
      setTimeout(function () {
        app.loggedIn = true;
        loginEl.classList.add('out');
        hudEl.classList.remove('hidden');
        app.onLogin();
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }, 650);
    } else {
      errEl.textContent = 'Wrong username or password. Check both and try again.';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      passIn.value = '';
      passIn.focus();
    }
  });

  $('logout').addEventListener('click', function () {
    app.loggedIn = false;
    hudEl.classList.add('hidden');
    loginEl.classList.remove('out');
    userIn.value = ''; passIn.value = ''; errEl.textContent = '';
    passIn.type = 'password'; $('togglePass').textContent = 'Show';
    app.onLogout();
  });

  if (typeof THREE === 'undefined') {
    $('loaderText').textContent = 'The 3D engine could not load. Connect to the internet and refresh this page.';
    document.querySelector('#loader .orbit').style.display = 'none';
    return;
  }

  /* =====================================================
     PROCEDURAL NOISE + TEXTURES (no external images)
     ===================================================== */
  function hash3(x, y, z) {
    var h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }
  function noise3(x, y, z) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var xf = x - xi, yf = y - yi, zf = z - zi;
    xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf); zf = zf * zf * (3 - 2 * zf);
    var a = hash3(xi, yi, zi), b = hash3(xi + 1, yi, zi), c = hash3(xi, yi + 1, zi), d = hash3(xi + 1, yi + 1, zi);
    var e = hash3(xi, yi, zi + 1), f = hash3(xi + 1, yi, zi + 1), g = hash3(xi, yi + 1, zi + 1), h = hash3(xi + 1, yi + 1, zi + 1);
    var x1 = a + (b - a) * xf, x2 = c + (d - c) * xf, x3 = e + (f - e) * xf, x4 = g + (h - g) * xf;
    var y1 = x1 + (x2 - x1) * yf, y2 = x3 + (x4 - x3) * yf;
    return y1 + (y2 - y1) * zf;
  }
  function fbm(x, y, z, oct) {
    var s = 0, a = 0.5, f = 1, n = 0;
    for (var i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; }
    return s / n;
  }

  // Builds an equirectangular canvas by sampling 3D noise on a sphere (seamless wrap).
  function makeSphereCanvas(w, h, fn) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data, o = [0, 0, 0, 255];
    for (var j = 0; j < h; j++) {
      var lat = (0.5 - (j + 0.5) / h) * Math.PI, y = Math.sin(lat), cl = Math.cos(lat);
      for (var i = 0; i < w; i++) {
        var th = (i / w) * Math.PI * 2, x = cl * Math.cos(th), z = cl * Math.sin(th);
        o[3] = 255;
        fn(x, y, z, o);
        var k = (j * w + i) * 4;
        d[k] = o[0]; d[k + 1] = o[1]; d[k + 2] = o[2]; d[k + 3] = o[3];
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }
  function tex(canvas) {
    var t = new THREE.CanvasTexture(canvas);
    t.anisotropy = 8;
    return t;
  }
  function mixTo(o, r, g, b, t) { o[0] = lerp(o[0], r, t); o[1] = lerp(o[1], g, t); o[2] = lerp(o[2], b, t); }

  /* ---------- Earth ---------- */
  var EW = 1024, EH = 512;
  var earthSpec = new Uint8Array(EW * EH), earthIdx = 0;
  function earthFn(x, y, z, o) {
    var e = fbm(x * 1.7 + 3.1, y * 1.7 + 1.3, z * 1.7 + 7.7, 6);
    var lat = Math.abs(y), sea = 0.5, spec = 255;
    if (e < sea) {
      var t = Math.min(1, ((sea - e) / sea) * 2.4);
      o[0] = lerp(46, 6, t); o[1] = lerp(128, 34, t); o[2] = lerp(182, 92, t);
    } else {
      spec = 0;
      var hgt = (e - sea) / (1 - sea);
      var m = fbm(x * 3 + 11, y * 3 + 5, z * 3 + 2, 4);
      var g1 = smooth(0.4, 0.58, m);
      o[0] = lerp(96, 38, g1); o[1] = lerp(132, 92, g1); o[2] = lerp(54, 42, g1);
      var dry = smooth(0.46, 0.34, m) * (1 - smooth(0.5, 0.75, lat));
      mixTo(o, 204, 172, 112, dry);
      mixTo(o, 112, 98, 84, smooth(0.14, 0.26, hgt));
      mixTo(o, 242, 244, 248, smooth(0.26, 0.38, hgt));
    }
    var ice = smooth(0.8, 0.9, lat + (fbm(x * 4, y * 4, z * 4, 3) - 0.5) * 0.14);
    if (ice > 0) { mixTo(o, 246, 249, 255, ice); spec = lerp(spec, 40, ice); }
    earthSpec[earthIdx++] = spec;
  }
  function cloudFn(x, y, z, o) {
    var c = fbm(x * 2.6 + 20, y * 2.9 + 9, z * 2.6 + 4, 5);
    var a = smooth(0.5, 0.74, c);
    o[0] = 255; o[1] = 255; o[2] = 255; o[3] = a * 235;
  }

  /* ---------- Other bodies ---------- */
  function sunFn(x, y, z, o) {
    var n = fbm(x * 3, y * 3, z * 3, 5), t = fbm(x * 9 + 5, y * 9, z * 9, 4);
    var heat = clamp(0.55 * n + 0.5 * t, 0, 1);
    o[0] = 255; o[1] = lerp(70, 238, heat); o[2] = lerp(0, 96, heat * heat);
  }
  function rockFn(base, contrast, craters) {
    return function (x, y, z, o) {
      var n = fbm(x * 5 + 2, y * 5, z * 5, 5);
      var v = base + (n - 0.5) * contrast;
      var rg = 1 - Math.abs(fbm(x * 11 + 4, y * 11, z * 11, 3) * 2 - 1);
      if (craters) v -= smooth(0.82, 0.96, rg) * 28;
      o[0] = v; o[1] = v * 0.97; o[2] = v * 0.92;
    };
  }
  function venusFn(x, y, z, o) {
    var w = fbm(x * 1.6, y * 3.2, z * 1.6, 3);
    var n = fbm(x * 2.2 + w * 1.6, y * 4 + w, z * 2.2 + w * 1.6, 5);
    var k = 0.78 + 0.32 * n;
    o[0] = 232 * k; o[1] = 192 * k; o[2] = 118 * k;
  }
  function marsFn(x, y, z, o) {
    var n = fbm(x * 3 + 8, y * 3, z * 3, 5), m = fbm(x * 6, y * 6 + 3, z * 6, 4);
    o[0] = lerp(150, 206, n); o[1] = lerp(70, 108, n); o[2] = lerp(40, 62, n);
    mixTo(o, 88, 52, 40, smooth(0.52, 0.66, m) * 0.7);
    mixTo(o, 246, 244, 240, smooth(0.9, 0.96, Math.abs(y) + (n - 0.5) * 0.1));
  }
  function jupiterFn(x, y, z, o) {
    var w = fbm(x * 3, y * 5, z * 3, 4) - 0.5;
    var b = Math.sin((y + w * 0.14) * 24) * 0.5 + 0.5;
    var b2 = Math.sin((y + w * 0.2) * 52 + 1.3) * 0.5 + 0.5;
    o[0] = lerp(176, 238, b); o[1] = lerp(118, 218, b); o[2] = lerp(78, 184, b);
    mixTo(o, 198, 132, 92, b2 * 0.35);
    var th = Math.atan2(z, x), dth = wrapAngle(th - 4.0), dy = y + 0.28;

      // put the camera so the Sun sits in the background on one side and the planet is well lit
      var ys = Math.atan2(-tmpV.x, -tmpV.z);
      cam.goal = { yaw: ys + Math.PI + 0.66, pitch: 0.2 };
    }
    cam.distT = cam.def;
    cam.vyaw = cam.vpitch = 0;
    updateChips(); updateInfo();
  }

  /* pointer input */
  dom.addEventListener('pointerdown', function (e) {
    try { dom.setPointerCapture(e.pointerId); } catch (_) {}
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    pointerCount = Object.keys(pointers).length;
    dragging = true; cam.goal = null; cam.vyaw = cam.vpitch = 0; lastMoveT = performance.now();
    if (pointerCount === 2) { lastPinch = pinchDist(); }
  });
  dom.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId]; if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointerCount === 1) {
      var now = performance.now(), dtm = Math.max(0.001, (now - lastMoveT) / 1000); lastMoveT = now;
      var k = 0.0055;
      cam.yaw -= dx * k; cam.pitch = clamp(cam.pitch + dy * k, -1.45, 1.45);
      cam.vyaw = clamp(-dx * k / dtm, -4, 4); cam.vpitch = clamp(dy * k / dtm, -4, 4);
    } else if (pointerCount === 2) {
      var d = pinchDist();
      if (lastPinch > 0 && d > 0) { cam.distT *= lastPinch / d; clampZoom(); }
      lastPinch = d;
    }
  });
  function endPointer(e) {
    delete pointers[e.pointerId];
    pointerCount = Object.keys(pointers).length;
    if (pointerCount === 0) { dragging = false; if (performance.now() - lastMoveT > 90) cam.vyaw = cam.vpitch = 0; }
    if (pointerCount < 2) lastPinch = 0;
  }
  dom.addEventListener('pointerup', endPointer);
  dom.addEventListener('pointercancel', endPointer);
  function pinchDist() {
    var ids = Object.keys(pointers); if (ids.length < 2) return 0;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  dom.addEventListener('wheel', function (e) {
    e.preventDefault();
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
    zoomBy(Math.exp(clamp(dy, -200, 200) * 0.0015));
  }, { passive: false });

  $('zoomIn').addEventListener('click', function () { zoomBy(0.78); });
  $('zoomOut').addEventListener('click', function () { zoomBy(1.28); });
  $('speedBtn').addEventListener('click', function () {
    speedIdx = (speedIdx + 1) % speeds.length;
    this.innerHTML = speeds[speedIdx] + '&times;';
  });
  $('pauseBtn').addEventListener('click', function () {
    paused = !paused; this.textContent = paused ? 'Play' : 'Pause';
  });
  $('labelBtn').addEventListener('click', function () {
    labelsOn = !labelsOn; this.setAttribute('aria-pressed', labelsOn ? 'true' : 'false');
  });
  window.addEventListener('keydown', function (e) {
    if (!app.loggedIn || /input|textarea/i.test((e.target && e.target.tagName) || '')) return;
    if (e.key === '+' || e.key === '=') zoomBy(0.8);
    else if (e.key === '-' || e.key === '_') zoomBy(1.25);
  });
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (!cam.focus) { var wasDefault = Math.abs(cam.distT - cam.def) < 1; cam.def = solarDefault(); if (wasDefault) cam.distT = cam.def; }
  });

  app.onLogin = function () { setFocus(byName['Earth']); };
  app.onLogout = function () { setFocus(null); };

  /* =====================================================
     ANIMATION LOOP
     ===================================================== */
  var clock = new THREE.Clock(), elapsed = 0, lastZoomTxt = '';
  var upV = new THREE.Vector3();

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    var ts = paused ? 0 : speeds[speedIdx];

    /* simulation */
    var i;
    for (i = 0; i < planets.length; i++) {
      var pl = planets[i];
      pl.pivot.rotation.y += pl.orbit * dt * ts;
      pl.mesh.rotation.y += pl.spin * dt * ts;
    }
    if (clouds) clouds.rotation.y += 0.36 * dt * ts;
    if (moonPivot) moonPivot.rotation.y += 0.55 * dt * ts;
    sunMesh.rotation.y += 0.03 * dt * ts;
    belt.rotation.y += 0.012 * dt * ts;
    var pulse = 1 + Math.sin(elapsed * 1.3) * 0.015;
    sunGlow1.scale.setScalar(20 * 4.2 * pulse);
    sunGlow2.scale.setScalar(20 * 9 * (1 + Math.sin(elapsed * 0.7 + 1) * 0.02));

    /* slow drift of the sky so the background is always alive */
    sky.rotation.y += 0.004 * dt;
    sky.rotation.x = Math.sin(elapsed * 0.02) * 0.05;
    for (i = 0; i < sky.children.length; i++) {
      var ch = sky.children[i];
      if (ch.isSprite && ch.userData.spin) ch.material.rotation += ch.userData.spin * dt;
    }

    /* camera follows planet's orbit so the Sun stays in the backdrop */
    if (cam.focus && cam.focus.orbit) {
      var th = cam.focus.orbit * dt * ts;
      cam.yaw += th;
      if (cam.goal && cam.goal.yaw !== null) cam.goal.yaw += th;
    }
    if (cam.goal) {
      var kk = 1 - Math.exp(-dt * 2.6), dp = cam.goal.pitch - cam.pitch, dyw = 0;
      if (cam.goal.yaw !== null) { dyw = wrapAngle(cam.goal.yaw - cam.yaw); cam.yaw += dyw * kk; }
      cam.pitch += dp * kk;
      if (Math.abs(dp) < 0.004 && Math.abs(dyw) < 0.004) cam.goal = null;
    } else if (!dragging) {
      cam.yaw += cam.vyaw * dt; cam.pitch = clamp(cam.pitch + cam.vpitch * dt, -1.45, 1.45);
      var decay = Math.exp(-dt * 3.5); cam.vyaw *= decay; cam.vpitch *= decay;
      if (!cam.focus && Math.abs(cam.vyaw) < 0.05) cam.yaw += (app.loggedIn ? 0.035 : 0.055) * dt;
    }

    focusPos(tmpP);
    cam.offset.multiplyScalar(Math.exp(-dt * 3.2));
    cam.cur.copy(tmpP).add(cam.offset);
    cam.dist = Math.exp(lerp(Math.log(cam.dist), Math.log(cam.distT), 1 - Math.exp(-dt * 5)));

    var pitch = cam.pitch + (app.loggedIn ? 0 : Math.sin(elapsed * 0.14) * 0.06);
    var cp = Math.cos(pitch);
    camera.position.set(
      cam.cur.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.cur.y + cam.dist * Math.sin(pitch),
      cam.cur.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    camera.lookAt(cam.cur);
    camera.updateMatrixWorld();
    sky.position.copy(camera.position);

    /* lighting: stronger camera fill when a single body is the subject */
    var fillT = cam.focus && cam.focus.name !== 'Sun' ? 0.7 : 0.12;
    fill.intensity += (fillT - fill.intensity) * (1 - Math.exp(-dt * 3));

    /* zoom readout */
    var z = Math.round((cam.def / cam.dist) * 100) + '%';
    if (z !== lastZoomTxt) { $('zoomRead').textContent = z; lastZoomTxt = z; }

    /* labels */
    var W = window.innerWidth, H = window.innerHeight;
    upV.setFromMatrixColumn(camera.matrixWorld, 1);
    for (i = 0; i < bodies.length; i++) {
      var b = bodies[i], show = app.loggedIn && labelsOn && (!cam.focus || cam.focus === b);
      if (!show) { b.label.style.visibility = 'hidden'; continue; }
      b.holder.getWorldPosition(tmpU);
      tmpU.addScaledVector(upV, b.radius * 1.3 + 1.2);
      tmpU.project(camera);
      if (tmpU.z > 1 || Math.abs(tmpU.x) > 1.2 || Math.abs(tmpU.y) > 1.2) { b.label.style.visibility = 'hidden'; continue; }
      b.label.style.visibility = 'visible';
      b.label.style.transform = 'translate(' + ((tmpU.x * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((-tmpU.y * 0.5 + 0.5) * H).toFixed(1) + 'px) translate(-50%,-100%)';
    }

    renderer.render(scene, camera);
  }

  /* =====================================================
     START (textures are generated procedurally, so show a loader first)
     ===================================================== */
  $('whoami').textContent = 'admin';
  requestAnimationFrame(function () {
    setTimeout(function () {
      try {
        buildWorld();
        buildChips();
        cam.def = cam.dist = cam.distT = solarDefault();
        setFocus(null);
        cam.goal = null;
        cam.offset.set(0, 0, 0);
        frame();
        $('loader').classList.add('hidden');
        setTimeout(function () { var l = $('loader'); if (l && l.parentNode) l.parentNode.removeChild(l); }, 1200);
      } catch (err) {
        console.error(err);
        $('loaderText').textContent = 'Something went wrong while building the scene: ' + err.message;
      }
    }, 60);
  });
})();
</script>
</body>
</html>
